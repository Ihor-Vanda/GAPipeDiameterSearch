[pytest]
testpaths = tests
markers =
    slow: наскрізні прогони солвера (секунди, не мілісекунди)
    reference: звірка еталонних прогонів Ханої зі знімком (близько хвилини).
        Пропускається, доки немає tests/reference_baseline.json —
        зніміть його командою `python tools/reference_run.py --save`.
        Швидкий прогін без нього: pytest -m "not reference"
