# Налаштування лінтера. Робочий набір перевірок — той, що в readme:
#     python -m ruff check --select F,ARG,ERA .
#
# `F`   — справжні помилки (невикористані імпорти, невизначені імена);
# `ARG` — невикористані аргументи (сліди мертвого коду);
# `ERA` — закоментований код.

[lint.per-file-ignores]
# Фікстура `pytest`, запитана заради **побічної дії**, не згадується в
# тілі тесту — і це не мертвий аргумент, а єдиний спосіб її замовити:
# ім'я аргументу і є ім'ям фікстури. Так працюють `workspace` (переводить
# прогін у тимчасовий каталог), `ctx`, `solver`, `worker` — вони
# створюють середовище, з яким працює перевірка.
#
# Підміни у фейкових класах (`def get_stats(self, solution)`) мусять
# повторювати сигнатуру справжнього методу, навіть коли аргумент їм не
# потрібен, — інакше підміна не підійде на місце оригіналу.
# `ARG005` — те саме для лямбд-підмін: `lambda sol, bonus: ...` мусить
# приймати обидва аргументи, бо стає на місце `swap_search(sol, bonus)`.
"tests/*" = ["ARG001", "ARG002", "ARG005"]

# Стенди-вимикачі в `ablation_probe.py` ставлять на місце справжнього
# методу заглушку, яка **мусить повторювати його сигнатуру** — інакше
# підміна не підійде на місце оригіналу. Те, що заглушка не читає
# аргументів, і є її змістом: механізм вимкнений. Це той самий випадок,
# що й ARG005 у тестах вище.
# `mechanism_census.py` і `round_size_probe.py` — те саме: предикати
# «чи виклик холостий» мають однаковий вигляд `(result, args)`, і
# половині з них аргументи не потрібні.
"experiments/ablation_probe.py" = ["ARG005"]
"experiments/mechanism_census.py" = ["ARG005"]
"experiments/round_size_probe.py" = ["ARG005"]
# `round_rule_ab.py` ставить на місце `round_cost_limit` заглушку
# «межі немає»: вона мусить повторювати сигнатуру, але жоден із
# аргументів їй не потрібен — у цьому й полягає вимкнення правила.
"experiments/round_rule_ab.py" = ["ARG001"]
